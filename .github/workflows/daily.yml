name: MPFS daily tracker

on:
  schedule:
    - cron: "0 11 * * *"      # 11:00 UTC daily (~7am ET). Adjust if you like.
  workflow_dispatch: {}         # lets you run it manually from the Actions tab

permissions:
  contents: write               # to commit the updated corpus back
  pages: write                  # to publish the page
  id-token: write

concurrency:
  group: mpfs-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system tools (PDF text + OCR)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Run the daily pipeline
        env:
          REGS_API_KEY:         ${{ secrets.REGS_API_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODEL:                ${{ vars.MODEL }}
        run: bash run_pipeline.sh
      - name: Commit updated corpus + page
        run: |
          git config user.name "mpfs-bot"
          git config user.email "mpfs-bot@users.noreply.github.com"
          git add corpus.db data.json dashboard.html || true
          git commit -m "daily update $(date -u +%F)" || echo "no changes to commit"
          git push || echo "nothing to push"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
